[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
lf-mide-core = { path = "crates/core" }
lf-mide-vcs = { path = "crates/vcs" }
lf-mide-ui = { path = "crates/ui" }

clap = { version = "4.6", features = ["derive"] }
color-eyre = "0.6"
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0"
futures = "0.3"
# No default features: avoids OpenSSL/libssh2; only local repo reads are needed.
git2 = { version = "0.21", default-features = false }
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
