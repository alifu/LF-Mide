# Phase 0 spike: prove Neovim can be embedded (nvim --embed + ext_linegrid)
# and rendered into a ratatui buffer. Not part of the main workspace.
[package]
name = "nvim-embed-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nvim-rs = { version = "0.9.2", features = ["use_tokio"] }
tokio = { version = "1.54", features = ["full"] }
ratatui = "0.30.2"
async-trait = "0.1"
